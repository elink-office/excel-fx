<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel関数 早引き表｜意味がわかるExcel時短術</title>
<meta name="description" content="事務職がよく使うExcel関数46個。「SUMって何？」からも「〜したい」からも引ける早引き表です。">
<meta name="theme-color" content="#2E6B4C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232E6B4C'/%3E%3Ctext x='50' y='72' font-size='62' font-family='Georgia,serif' font-style='italic' text-anchor='middle' fill='%23fff'%3Efx%3C/text%3E%3C/svg%3E">

<style>
  :root {
    --paper:      #FAF9F5;
    --card:       #FFFFFF;
    --ink:        #16211C;
    --ink-sub:    #64716A;
    --ink-faint:  #8D978F;
    --green:      #2E6B4C;
    --green-deep: #1F4E37;
    --green-tint: #E9F1EC;
    --green-line: #CBDDD1;
    --rule:       #E4E4DD;
    --shadow:     0 1px 2px rgba(22,33,28,.05), 0 4px 14px rgba(22,33,28,.05);
    --accent:      #C0642C;
    --accent-ink:  #7A3D14;
    --accent-sub:  #9A6238;
    --accent-bg:   #FDF3EA;
    --accent-line: #EFD8C2;
    --accent-dot:  #F6E0CA;
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:      #121714;
      --card:       #1A211D;
      --ink:        #E7EDE8;
      --ink-sub:    #9BA8A0;
      --ink-faint:  #7A867E;
      --green:      #79C79B;
      --green-deep: #A5DDBE;
      --green-tint: #1E2E25;
      --green-line: #2E463A;
      --rule:       #26302B;
      --shadow:     0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
      --accent:      #E0A277;
      --accent-ink:  #F0D6BE;
      --accent-sub:  #BC9878;
      --accent-bg:   #2A1E15;
      --accent-line: #48331F;
      --accent-dot:  #3D2A1B;
    }
  }

  :root[data-theme="dark"] {
    --paper:      #121714;
    --card:       #1A211D;
    --ink:        #E7EDE8;
    --ink-sub:    #9BA8A0;
    --ink-faint:  #7A867E;
    --green:      #79C79B;
    --green-deep: #A5DDBE;
    --green-tint: #1E2E25;
    --green-line: #2E463A;
    --rule:       #26302B;
    --shadow:     0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --accent:      #E0A277;
    --accent-ink:  #F0D6BE;
    --accent-sub:  #BC9878;
    --accent-bg:   #2A1E15;
    --accent-line: #48331F;
    --accent-dot:  #3D2A1B;
  }

  :root[data-theme="light"] {
    --paper:      #FAF9F5;
    --card:       #FFFFFF;
    --ink:        #16211C;
    --ink-sub:    #64716A;
    --ink-faint:  #8D978F;
    --green:      #2E6B4C;
    --green-deep: #1F4E37;
    --green-tint: #E9F1EC;
    --green-line: #CBDDD1;
    --rule:       #E4E4DD;
    --shadow:     0 1px 2px rgba(22,33,28,.05), 0 4px 14px rgba(22,33,28,.05);
    --accent:      #C0642C;
    --accent-ink:  #7A3D14;
    --accent-sub:  #9A6238;
    --accent-bg:   #FDF3EA;
    --accent-line: #EFD8C2;
    --accent-dot:  #F6E0CA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic",
                 "Noto Sans JP", "Meiryo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .mono {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 64px;
  }

  /* ── ヘッダー ───────────────────── */
  header {
    padding: 28px 0 18px;
  }
  .brandrow {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 6px;
  }
  .eyebrow {
    font-size: 12.5px;
    letter-spacing: .06em;
    color: var(--green);
    font-weight: 700;
    margin: 0;
  }
  .iglink {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    margin-right: -8px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--green);
  }
  .iglink svg { width: 21px; height: 21px; }
  .iglink:hover { background: var(--green-tint); }
  .iglink:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  h1 {
    font-size: 26px;
    line-height: 1.35;
    margin: 0 0 8px;
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .lede {
    margin: 0;
    color: var(--ink-sub);
    font-size: 14.5px;
    max-width: 34em;
  }

  /* ── 検索まわり（固定） ─────────────── */
  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    padding: 12px 0 10px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .iconbtn {
    flex: 0 0 auto;
    width: 38px; height: 36px;
    display: grid; place-items: center;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--ink-sub);
    cursor: pointer;
  }
  .iconbtn svg { width: 18px; height: 18px; }
  .iconbtn:hover { color: var(--ink); }
  .iconbtn:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  .iconbtn[aria-expanded="true"] {
    background: var(--green); border-color: var(--green); color: #fff;
  }
  @media (prefers-color-scheme: dark) { .iconbtn[aria-expanded="true"] { color: #121714; } }
  :root[data-theme="dark"] .iconbtn[aria-expanded="true"] { color: #121714; }
  :root[data-theme="light"] .iconbtn[aria-expanded="true"] { color: #fff; }

  .searchbox { position: relative; display: flex; }
  .searchbox[hidden] { display: none; }
  #q {
    width: 100%;
    padding: 11px 44px 11px 14px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  #q::placeholder { color: var(--ink-faint); }
  #q:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: transparent; }

  #clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: 0; border-radius: 8px;
    background: transparent; color: var(--ink-faint);
    font-size: 18px; line-height: 1; cursor: pointer; display: none;
  }
  #clear:hover { background: var(--green-tint); color: var(--ink); }
  #clear:focus-visible { outline: 2px solid var(--green); }

  .row2 {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  #cat, #sort {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit; font-size: 13.5px;
    padding: 7px 30px 7px 11px;
    color: var(--ink);
    background: var(--card);
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-sub) 50%),
                      linear-gradient(135deg, var(--ink-sub) 50%, transparent 50%);
    background-position: right 14px center, right 9px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    border: 1px solid var(--rule);
    border-radius: 8px;
    cursor: pointer;
    appearance: none;
  }
  #cat:focus-visible, #sort:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  #cat.on { border-color: var(--green); color: var(--green-deep); font-weight: 700; }
  #sort { border-color: var(--green-line); color: var(--green-deep); font-weight: 700; }

  .metarow {
    margin: 12px 2px 0;
    font-size: 12.5px; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* ── リスト ───────────────────── */
  .list { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }

  /* 一覧は、広い画面で2列。上から下へ流れる（縦読み） */
  .list.isidx { display: block; padding-top: 4px; }
  @media (min-width: 620px) {
    .list.isidx { column-count: 2; column-gap: 30px; }
  }
  .list.isidx .groupname {
    break-after: avoid-column;
    -webkit-column-break-after: avoid;
  }
  .list.isidx .idxrow {
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
  }
  .list.isidx .groupname:first-child { padding-top: 0; }

  .groupname {
    font-size: 12px; font-weight: 700; letter-spacing: .1em;
    color: var(--green); text-transform: uppercase;
    padding: 14px 2px 2px;
  }

  .item {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .item > summary {
    list-style: none;
    cursor: pointer;
    padding: 13px 15px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 10px;
    align-items: start;
  }
  .item > summary::-webkit-details-marker { display: none; }
  .item > summary:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }

  .fname {
    grid-column: 1;
    font-size: 17px; font-weight: 700; color: var(--green-deep);
    letter-spacing: .02em;
  }
  .no {
    display: inline-block;
    min-width: 2.2em;
    text-align: center;
    background: var(--accent-bg);
    color: var(--accent-ink);
    border-radius: 5px;
    font-size: 11.5px; font-weight: 700;
    padding: 2px 5px;
    margin-right: 8px;
    vertical-align: 2.5px;
  }
  .what {
    grid-column: 1;
    font-size: 15px; color: var(--ink);
  }
  .when {
    grid-column: 1;
    font-size: 13.5px; color: var(--ink-sub);
    margin-top: 3px;
  }
  .when::before {
    content: "こんなとき";
    display: inline-block;
    font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
    color: var(--green);
    background: var(--green-tint);
    border-radius: 4px;
    padding: 1px 5px;
    margin-right: 6px;
    vertical-align: 1.5px;
  }
  .caret {
    grid-column: 2; grid-row: 1 / span 3;
    align-self: center;
    color: var(--ink-faint); font-size: 12px;
    transition: transform .15s ease;
  }
  .item[open] .caret { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .caret { transition: none; } }

  .body {
    padding: 0 15px 15px;
    border-top: 1px dashed var(--rule);
    margin-top: 2px;
    padding-top: 12px;
  }
  .lbl {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-faint); margin: 0 0 4px;
  }
  .code {
    display: block;
    background: var(--green-tint);
    border: 1px solid var(--green-line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--green-deep);
    overflow-x: auto;
    white-space: pre;
  }
  .note {
    margin: 12px 0 0;
    font-size: 13.5px;
    color: var(--ink-sub);
  }

  /* ── 作った人からのひとこと（吹き出し） ────── */
  .promo {
    display: flex;
    gap: 10px;
    padding: 2px 2px 14px;
  }
  /* ▼アイコン：画像に差し替えるときは <img class="picon" src="..."> にするだけ */
  .promo .picon {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 50%;
    object-fit: cover;
    background: var(--accent-dot);
    color: var(--accent-ink);
    font-size: 15px; font-weight: 700;
  }
  .promo .ptxt { flex: 1 1 auto; min-width: 0; }
  .promo .pname {
    display: block;
    font-size: 11.5px; color: var(--ink-faint);
    margin: 0 0 3px 3px;
  }
  .promo .bubble {
    position: relative;
    display: block;
    background: var(--accent-bg);
    border-radius: 4px 14px 14px 14px;
    padding: 11px 14px;
    font-size: 14.5px; line-height: 1.75;
    color: var(--ink);
  }
  .promo .bubble::before {
    content: "";
    position: absolute;
    left: -6px; top: 0;
    width: 0; height: 0;
    border-top: 8px solid var(--accent-bg);
    border-left: 7px solid transparent;
  }
  .promo a {
    color: var(--accent-ink);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 3px;
    text-decoration-thickness: 2px;
  }
  .promo a:hover { text-decoration-thickness: 3px; }
  .promo a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── やりたいこと一覧（索引） ───────────── */
  .idxrow {
    display: flex; align-items: baseline; gap: 10px;
    width: 100%; text-align: left;
    font: inherit; font-size: 14.5px; line-height: 1.5;
    color: var(--ink);
    background: none;
    border: 0;
    border-bottom: 1px solid var(--rule);
    padding: 8px 5px;
    cursor: pointer;
  }
  .idxrow:hover { background: var(--green-tint); }
  .idxrow:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
  .idxrow .iw { flex: 1 1 auto; }
  .idxrow .ifn {
    flex: 0 0 auto;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 13px; font-weight: 700; color: var(--green-deep);
  }
  .idxrow .ifn.lead { order: -1; min-width: 7.2em; }
  .idxrow .ino {
    order: -2; flex: 0 0 auto;
    min-width: 1.8em; text-align: right;
    font-size: 12px; font-weight: 700; color: var(--accent-ink);
    font-variant-numeric: tabular-nums;
  }
  .idxhint {
    font-size: 12.5px; color: var(--ink-faint);
    padding: 2px 4px 8px;
  }

  /* ── 1件だけの詳細画面 ───────────────── */
  .backbtn {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 14px;
    background: none; border: 0;
    color: var(--green-deep); font-weight: 700;
    padding: 6px 4px; margin-bottom: 6px;
    cursor: pointer;
  }
  .backbtn:hover { text-decoration: underline; }
  .backbtn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .detail {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 18px;
  }
  .detail .dhead {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-bottom: 2px;
  }
  .detail .dname {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 26px; font-weight: 700; color: var(--green-deep);
    letter-spacing: .02em;
  }
  .detail .dcat {
    font-size: 11.5px; color: var(--green);
    background: var(--green-tint);
    border-radius: 5px; padding: 3px 8px;
  }
  .detail .dwhat { font-size: 17px; margin: 0 0 16px; }
  .detail dl { margin: 0; display: grid; gap: 14px; }
  .detail dt {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-faint); margin-bottom: 3px;
  }
  .detail dd { margin: 0; font-size: 15px; line-height: 1.75; }
  .detail dd.dnote { color: var(--ink-sub); font-size: 14px; }

  .dnav {
    display: flex; gap: 8px; margin-top: 18px;
  }
  .dnav button {
    flex: 1 1 0;
    font: inherit; font-size: 13.5px;
    padding: 10px 8px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--ink-sub);
    cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dnav button:hover:not(:disabled) { border-color: var(--green); color: var(--green-deep); }
  .dnav button:disabled { opacity: .35; cursor: default; }
  .dnav button:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-sub);
    font-size: 15px;
  }
  .empty strong { color: var(--ink); }

  /* ── フッター ───────────────────── */
  footer { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 24px; }
  .cta {
    display: block;
    background: var(--accent-bg);
    border: 1px solid var(--accent-line);
    color: var(--accent-ink);
    text-decoration: none;
    border-radius: var(--radius);
    padding: 15px 17px;
  }
  .cta:hover { border-color: var(--accent); }
  .cta strong {
    display: block; font-size: 15.5px;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 3px;
    text-decoration-thickness: 2px;
  }
  .cta span { display: block; font-size: 13px; color: var(--accent-sub); margin-top: 2px; }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sig { margin-top: 20px; font-size: 13px; color: var(--ink-sub); }
  .sig a { color: var(--green-deep); }

  @media (max-width: 420px) {
    h1 { font-size: 22px; }
    .wrap { padding: 0 13px 56px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brandrow">
      <p class="eyebrow">ゆうこ｜意味がわかる Excel時短術</p>
      <a class="iglink" href="https://www.instagram.com/yuko_excel/" aria-label="Instagramを見る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>
    </div>
    <h1>関数 早引き表</h1>
    <p class="lede">「SUMって何？」からも、「〜したい」からも引けます。関数名を知らなくて大丈夫。</p>
  </header>

  <div class="controls">
    <div class="row2">
      <button class="iconbtn" id="sbtn" type="button" aria-label="関数をさがす" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
        </svg>
      </button>
      <select id="cat" aria-label="分類でしぼる"></select>
      <select id="sort" aria-label="並び順"></select>
    </div>
    <div class="searchbox" id="sbox" hidden>
      <input id="q" type="search" placeholder="合計 / さがす / SUM …" autocomplete="off" aria-label="関数をさがす">
      <button id="clear" type="button" aria-label="入力を消す">✕</button>
    </div>
  </div>

  <div id="promoslot"></div>

  <p class="metarow"><span id="count"></span></p>

  <div class="list" id="list"></div>

  <footer>
    <a class="cta" href="https://elink-office.com/excel-shindan/">
      <strong>今の自分を知ろう！自己流度チェックはここをクリック&gt;&gt;&gt;</strong>
      <span>あなたのExcel、自己流になっていませんか？</span>
    </a>
    <p class="sig">
      わからないところは公式LINEで聞いてください。必ずご返答いたします。<br>
      ゆうこ｜意味がわかるExcel時短術
      <a href="https://www.instagram.com/yuko_excel/">Instagram</a>
      <a href="https://lin.ee/odBbx5nM">公式LINE</a>
    </p>
  </footer>
</div>

<script>
const DATA = [
  // 合計・計算

const CATS = ["合計・計算","数える","探す・引っぱる","条件で分ける","日付・曜日","文字をあつかう","最大・最小・順位","新しい関数"];

// 覚える順番（1→2→3）。入れ替えたいときはこの3行だけ直せばOK
const LV = {
  1: ["SUM","AVERAGE","COUNT","COUNTA","MAX","MIN","TODAY","ROUND","IF","LEFT","RIGHT","LEN"],
  2: ["SUMIF","COUNTIF","COUNTBLANK","ROUNDUP","ROUNDDOWN","SUBTOTAL","VLOOKUP","XLOOKUP","IFERROR",
      "TEXT","DATE","WEEKDAY","MID","TRIM","SUBSTITUTE","RANK","TEXTJOIN","ASC","PHONETIC"],
  3: ["SUMIFS","COUNTIFS","IFS","AND","OR","INDEX","MATCH","HLOOKUP","EOMONTH","DATEDIF",
      "LARGE","SMALL","FILTER","SORT","UNIQUE"]
};
const LVNAME = { 1:"まず覚えたい　1 → 12", 2:"つぎに覚えたい　13 → 31", 3:"慣れてきたら　32 → 46" };
const ORDER = [...LV[1], ...LV[2], ...LV[3]];   // これが「覚える順」の通し番号
DATA.forEach(d => {
  d.lv = LV[1].includes(d.n) ? 1 : LV[2].includes(d.n) ? 2 : 3;
  d.no = ORDER.indexOf(d.n) + 1;
});

let state = { q: "", cat: "すべて", sort: "idx", detail: null };

const $q = document.getElementById("q");
const $clear = document.getElementById("clear");
const $sbtn = document.getElementById("sbtn");
const $sbox = document.getElementById("sbox");
const $cat = document.getElementById("cat");
const $sort = document.getElementById("sort");
const $list = document.getElementById("list");
const $count = document.getElementById("count");

// 分類（プルダウン）
["すべて", ...CATS].forEach(c => {
  const o = document.createElement("option");
  o.value = c;
  o.textContent = c === "すべて" ? "すべての分類" : c;
  $cat.appendChild(o);
});
function setCat(c) {
  state.cat = c;
  $cat.value = c;
  $cat.classList.toggle("on", c !== "すべて");
}
$cat.addEventListener("change", () => { setCat($cat.value); state.detail = null; render(); });

// 並び順（プルダウン）
const SORTS = [
  ["idx", "やりたいこと順"],
  ["lv",  "覚える順"],
  ["abc", "A → Z 順"]
];
SORTS.forEach(([v, label]) => {
  const o = document.createElement("option");
  o.value = v; o.textContent = label;
  $sort.appendChild(o);
});
$sort.value = state.sort;
$sort.addEventListener("change", () => {
  state.sort = $sort.value; state.detail = null; render();
});

// 検索の開け閉め
$sbtn.addEventListener("click", () => {
  const open = $sbox.hidden;
  $sbox.hidden = !open;
  $sbtn.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) { $q.focus(); }
  else if (state.q) { $q.value = ""; state.q = ""; $clear.style.display = "none"; render(); }
});
$q.addEventListener("input", () => {
  state.q = $q.value.trim().toLowerCase();
  $clear.style.display = $q.value ? "block" : "none";
  state.detail = null;
  render();
});
$clear.addEventListener("click", () => {
  $q.value = ""; state.q = ""; $clear.style.display = "none"; $q.focus(); render();
});

function render() {
  const q = state.q;
  let rows = DATA.filter(d => {
    if (state.cat !== "すべて" && d.c !== state.cat) return false;
    if (!q) return true;
    return (d.n + " " + d.k + " " + d.w + " " + d.u + " " + d.c).toLowerCase().includes(q);
  });

  if (state.sort === "abc") {
    rows = [...rows].sort((a, b) => a.n.localeCompare(b.n));
  } else if (state.sort === "lv") {
    rows = [...rows].sort((a, b) => a.no - b.no);
  } else {
    rows = [...rows].sort((a, b) => CATS.indexOf(a.c) - CATS.indexOf(b.c));
  }

  // 1件だけの詳細
  if (state.detail) { renderDetail(rows); return; }

  // 一覧
  $count.textContent = (state.cat === "すべて" ? "" : "「" + state.cat + "」")
    + rows.length + " / " + DATA.length + " 件　タップでその関数へ";
  $list.className = "list isidx";
  $list.innerHTML = "";

  if (!rows.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.innerHTML = '<strong>見つかりませんでした。</strong><br>'
      + 'ちがう言葉で探すか、公式LINEで聞いてください。';
    $list.appendChild(p);
    return;
  }

  let lastGroup = null;
  rows.forEach(d => {
    const g = state.sort === "idx" ? d.c
            : state.sort === "lv"  ? LVNAME[d.lv]
            : null;
    if (g && g !== lastGroup) {
      const h = document.createElement("div");
      h.className = "groupname";
      h.textContent = g;
      $list.appendChild(h);
      lastGroup = g;
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "idxrow";
    if (state.sort === "idx") {
      b.innerHTML = '<span class="iw">' + esc(d.w) + '</span>'
                  + '<span class="ifn">' + esc(d.n) + '</span>';
    } else {
      b.innerHTML = (state.sort === "lv" ? '<span class="ino">' + d.no + '</span>' : '')
                  + '<span class="ifn lead">' + esc(d.n) + '</span>'
                  + '<span class="iw">' + esc(d.w) + '</span>';
    }
    b.addEventListener("click", () => openDetail(d.n));
    $list.appendChild(b);
  });
}

function openDetail(name) {
  state.detail = name;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderDetail(rows) {
  const d = DATA.find(x => x.n === state.detail);
  if (!d) { state.detail = null; render(); return; }

  const i = rows.findIndex(x => x.n === d.n);
  const prev = i > 0 ? rows[i - 1] : null;
  const next = i >= 0 && i < rows.length - 1 ? rows[i + 1] : null;

  $count.textContent = state.sort === "lv"
    ? "覚える順　" + d.no + " / " + DATA.length
    : "";
  $list.className = "list";
  $list.innerHTML = "";

  const back = document.createElement("button");
  back.type = "button";
  back.className = "backbtn";
  back.innerHTML = '<span aria-hidden="true">&lsaquo;</span> 一覧にもどる';
  back.addEventListener("click", () => {
    state.detail = null; render(); window.scrollTo({ top: 0 });
  });
  $list.appendChild(back);

  const art = document.createElement("article");
  art.className = "detail";
  art.innerHTML =
      '<div class="dhead">'
    +   '<span class="dname">' + esc(d.n) + '</span>'
    +   '<span class="dcat">' + esc(d.c) + '</span>'
    + '</div>'
    + '<p class="dwhat">' + esc(d.w) + '</p>'
    + '<dl>'
    +   '<div><dt>こんなとき</dt><dd>' + esc(d.u) + '</dd></div>'
    +   '<div><dt>書き方</dt><dd><code class="code mono">' + esc(d.h) + '</code></dd></div>'
    +   '<div><dt>メモ</dt><dd class="dnote">' + esc(d.m) + '</dd></div>'
    + '</dl>';

  const nav = document.createElement("div");
  nav.className = "dnav";
  const mk = (item, label) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = item ? label.replace("%s", item.n) : label.replace("%s", "―");
    b.disabled = !item;
    if (item) b.addEventListener("click", () => openDetail(item.n));
    return b;
  };
  nav.appendChild(mk(prev, "‹ %s"));
  nav.appendChild(mk(next, "%s ›"));
  art.appendChild(nav);

  $list.appendChild(art);
}

document.getElementById("promoslot").appendChild(makePromo());
render();
</script>
